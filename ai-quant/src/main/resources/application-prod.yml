server:
  port: 8118

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chain.ai.trade.engine.signal.entity.dos,com.chain.ai.trade.engine.strategy.entity.dos
  mapper-package: com.chain.ai.trade.engine.signal.mapper,com.chain.ai.trade.engine.strategy.mapper

alert:
  mail:
    enabled: true
    to: 13713587424@163.com

risk:
  orchestrator:
    default-evaluators: trend-strength,volume-confirmation,risk-reward,elliott-wave
    default-adjusters: quality-based,risk-based
    multi-timeframe:
      enabled: false
      timeframes: H1,M15,M3
      data-limit: 500
    min-composite-score: 0.5
    base-position-size: 1.0
    max-recommended-signals: 10
  evaluator:
    elliott-wave:
      weight: 1.5
      min-bars: 200
      fib-tolerance: 0.25
      factors:
        base-confidence: 0.35
        structure-completeness: 0.25
        confluence: 0.15
        invalidation: 0.15
        direction-match: 0.10
        price-position: 0.05
      risk-thresholds:
        high-risk-max: 0.4
        medium-risk-max: 0.7
        low-risk-min: 0.7
      price-position:
        channel-upper-threshold: 80
        channel-lower-threshold: 20
        min-risk-reward-ratio: 1.5
        warning-risk-reward-ratio: 1.0
      multi-timeframe:
        enabled: false
        weights:
          hourly: 0.5
          quarterly: 0.3
          minute: 0.2
        min-agreement: 0.6
      scenario-selection:
        prioritize-current-phase: true
        min-confidence-difference: 5.0
        direction-weight: 0.6
        phase-weight: 0.4

strategy:
  mode: BIDIRECTIONAL
  bollinger-rsi:
    use-risk-module: true
    risk-module-evaluators: macd

telegram:
  bot:
    token: "123456789:ABCDEF1234567890abcdef"
  chat:
    id: -123456789

# K线Redis缓存：实盘开启缓存最近1200条K线，减少数据库压力
kline:
  redis-cache:
    enabled: true

logging:
  level:
    com.chain.ai.trade.engine.mapper: info
    com.chain.ai.trade.engine.data.service: info
    com.baomidou.mybatisplus: warn
    org.apache.ibatis: warn
    java.sql: warn
    java.sql.Connection: warn
    java.sql.Statement: warn
    java.sql.PreparedStatement: warn

trading:
  bidirectional:
    mode: HEDGED

    direction-selector:
      type: CUSTOM
      trend-based:
        ema-period: 20
      rsi-based:
        rsi-period: 14
        oversold-threshold: 30
        overbought-threshold: 70

    risk-management:
      max-position-size: 1.0
      allow-hedging: true
      transaction-cost-model: ZERO
      holding-cost-model: ZERO

